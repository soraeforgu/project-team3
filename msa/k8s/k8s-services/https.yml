# cert-manager
# kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.0/cert-manager.yaml

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: my-issuer
  namespace: soldesk
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: rltjr123@gmail.com
    privateKeySecretRef:
      name: my-issuer
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-kanges-click-tls
  namespace: soldesk
spec:
  secretName: app-kanges-click-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: my-issuer
    kind: ClusterIssuer
  commonName: app.kanges.click
  dnsNames:
    - app.kanges.click
