apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argo-kanges-click-tls
  namespace: argocd
spec:
  secretName: argo-kanges-click-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: my-issuer
    kind: ClusterIssuer
  commonName: argo.kanges.click
  dnsNames:
    - argo.kanges.click
